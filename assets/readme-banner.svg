<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d"><title id="t">Git Aliases Lite</title><desc id="d">Terminal command shortcuts appear as concise aliases.</desc><defs><linearGradient id="bg"><stop stop-color="#17263b"/><stop offset="1" stop-color="#0a111d"/></linearGradient></defs><rect width="1200" height="300" rx="24" fill="url(#bg)"/><rect x="85" y="78" width="1030" height="150" rx="14" fill="#080f1b" stroke="#30465e" stroke-width="2"/><circle cx="112" cy="103" r="6" fill="#ff9e8e"/><circle cx="134" cy="103" r="6" fill="#ffc77a"/><circle cx="156" cy="103" r="6" fill="#62e3c1"/><g font-family="monospace" font-size="21"><text x="120" y="155" fill="#62e3c1">$ gs</text><text x="235" y="155" fill="#edf3ff">git status</text><text x="120" y="195" fill="#62e3c1">$ gl</text><text x="235" y="195" fill="#edf3ff">git log --oneline</text></g><path d="M780 155H1025" stroke="#a89bff" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" values="0;-64" dur="2.5s" repeatCount="indefinite"/></path><text x="58" y="48" fill="#edf3ff" font-family="Arial,sans-serif" font-size="23" font-weight="700" letter-spacing="5">GIT ALIASES LITE</text><text x="1140" y="48" text-anchor="end" fill="#91a0ba" font-family="monospace" font-size="13" letter-spacing="3">LESS TYPING / SAME GIT</text></svg>